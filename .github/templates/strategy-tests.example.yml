name: Strategy integration checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  reusable-strategies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight controller and tests
        run: python -m pip install -e '.[test]'
      - name: Check discovery, controller and archived evidence
        run: >-
          python -m pytest -q
          tests/test_cli.py tests/test_repository_layout.py
          src/synthetic_traffic_validation/tests/test_deficit_matching.py
          src/synthetic_traffic_validation/tests/test_evidence.py
